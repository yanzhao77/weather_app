name: nexus_weather
description: "Nexus Weather — Futuristic HUD Weather App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.4.3+1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  go_router: ^14.2.7
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  equatable: ^2.0.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - .env/
