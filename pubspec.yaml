name: nexus_weather
description: "Nexus Weather — Futuristic HUD Weather App"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 2.6.x 存在 StateNotifierProvider.family 闭包 ref.read 抛 NotInitializedError 回归，锁定 2.5.1
  flutter_riverpod: 2.5.1
  dio: ^5.4.3+1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  go_router: ^14.2.7
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  equatable: ^2.0.5
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Medium.ttf
          weight: 500
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/Orbitron-Black.ttf
          weight: 900
